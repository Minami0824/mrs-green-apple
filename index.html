<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mrs. GREEN APPLE">
<link rel="manifest" href="manifest.webmanifest">
<title>My Mrs. GREEN APPLE</title>
<style>
:root{--green:#176b4b;--green2:#209765;--mint:#edf7f1;--bg:#f4f8f5;--card:#fff;--text:#173126;--muted:#718078;--line:#dfeae4;--dark:#0e3f2e}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#e5f5eb 0,#f4f8f5 34%,#f4f8f5 100%);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:104px}.top{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:rgba(255,255,255,.94);position:relative;z-index:4;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brandrow{display:flex;align-items:center;gap:11px}.brandmark{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#124c37,#2aa66f);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;box-shadow:0 6px 14px #176b4b22}.brand{font-weight:900;font-size:19px;letter-spacing:.4px;color:var(--dark)}.sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1.2px}.topnote{margin-left:auto;font-size:10px;text-align:right;line-height:1.5;color:#5d7168}
main{padding:14px}.hero2{background:linear-gradient(135deg,#0b4a34,#176b4b 55%,#0d3b2c);color:#fff;border-radius:25px;overflow:hidden;box-shadow:0 12px 30px #0b4a3422;margin-bottom:14px;position:relative}.hero2:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 20%,#78d8a855 0 2px,transparent 3px),radial-gradient(circle at 80% 30%,#fff4 0 2px,transparent 3px),radial-gradient(circle at 62% 80%,#fff3 0 1px,transparent 2px);background-size:90px 80px,110px 100px,70px 70px;opacity:.8}.heroInner{position:relative;display:grid;grid-template-columns:1.05fr .95fr;min-height:190px}.heroVisual{padding:20px 10px 18px 20px;display:flex;align-items:center;justify-content:center;text-align:center}.heroTitle{font-family:cursive;font-size:29px;line-height:1.15;transform:rotate(-3deg);text-shadow:0 2px 0 #062d20}.heroInfo{padding:20px 18px 18px 8px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;opacity:.8}.nextDate{font-size:20px;font-weight:800;margin-top:6px}.nextTitle{font-size:16px;opacity:.95}.days{margin-top:14px;padding-top:10px;border-top:1px solid #ffffff55;font-size:12px}.days strong{font-size:43px;line-height:1}.days span{font-size:14px;font-weight:800}.heroArrow{position:absolute;right:15px;bottom:14px;border:1px solid #fff9;border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:19px;padding:12px 7px;text-align:center;box-shadow:0 5px 18px #176b4b0b}.stat .statIcon{font-size:18px}.stat b{display:block;font-size:20px;margin-top:3px;color:var(--green)}.stat span{display:block;color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap}.stat small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.section{margin-top:20px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:0 3px 9px}.section h2{font-size:19px;margin:0;color:var(--dark);letter-spacing:.3px}.scribble{font-family:cursive;font-size:14px;color:#6d8177}.today{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 20px #176b4b0b}.todayTitle{font-family:cursive;font-size:21px;color:var(--green);margin-bottom:10px}.todayGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.songCard{background:#f5faf7;border:1px solid #e0eee6;border-radius:16px;padding:11px;min-width:0;position:relative}.songLabel{font-size:9px;color:var(--green);font-weight:800}.songName{font-size:16px;font-weight:900;margin-top:4px}.songArtist{font-size:9px;color:var(--muted);margin-top:2px}.playdot{position:absolute;right:9px;bottom:9px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px}
.quick{display:flex;gap:8px;overflow:auto;padding:2px 1px 4px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quickCard{flex:0 0 96px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 5px 16px #176b4b0a}.quickIcon{font-size:22px}.quickCard b{display:block;font-size:12px;margin-top:6px}.quickCard span{display:block;color:var(--muted);font-size:8px;margin-top:4px}
.mydata{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px #176b4b0b}.dataRow{padding:13px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.dataRow:last-child{border:0}.dataIcon{width:36px;height:36px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:18px}.dataRow .grow{flex:1}.dataRow b{display:block;font-size:13px}.dataRow .muted{font-size:10px;margin-top:2px}.chev{color:var(--green);font-size:18px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.item{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.item:last-child{border:0}.item .grow{flex:1}.pill{font-size:10px;padding:5px 8px;border-radius:99px;background:#eaf6ef;color:var(--green);white-space:nowrap}.muted{color:var(--muted);font-size:12px}.icon{font-size:25px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left);backdrop-filter:blur(14px)}.navin{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(6,1fr)}nav button{border:0;background:none;font-size:10px;color:#738078;padding:4px 0}nav button .ni{display:block;font-size:21px;margin-bottom:2px}nav button.active{color:var(--green);font-weight:800}
button.primary{border:0;background:var(--green);color:#fff;border-radius:13px;padding:11px 14px;font-weight:800}.fab{position:fixed;right:18px;bottom:92px;width:54px;height:54px;border:0;border-radius:50%;background:var(--green2);color:#fff;font-size:29px;box-shadow:0 8px 22px #176b4b44;z-index:8}
form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:#fafdfb}textarea{min-height:90px}.empty{padding:25px;text-align:center;color:var(--muted)}.calWrap{background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:0 6px 20px #176b4b0b}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.calHead b{font-size:18px}.calHead button{border:0;background:var(--mint);color:var(--green);border-radius:12px;width:40px;height:40px;font-size:24px}.calDow,.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calDow span{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px 0}.calDay{border:1px solid #e7eee9!important;background:#fff;border-radius:11px!important;min-width:0!important;min-height:61px!important;padding:6px!important;text-align:left;font-size:12px!important;position:relative}.calDay.muted{background:#fafbfa;color:#aeb6b0}.calDay.today{outline:2px solid var(--green)}.dots{display:flex;gap:3px;margin-top:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}.dot.tv{background:#2d7a55}.dot.ticket{background:#9b6b32}.dot.goods{background:#7b5b9a}.dot.event{background:#3d7899}.dot.other{background:#777}.calEvent{font-size:8px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:9px 3px 0;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:4px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;white-space:nowrap}.tabs button.on{background:var(--green);color:#fff}.money{font-size:28px;font-weight:800}.danger{color:#b64242}.check{color:var(--green)}
@media(max-width:390px){.brand{font-size:17px}.heroTitle{font-size:25px}.nextDate{font-size:17px}.stat b{font-size:17px}.quickCard{flex-basis:88px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brandrow"><div class="brandmark">M</div><div><div class="brand">Mrs. GREEN APPLE 🍏</div><div class="sub">MY MRS. GREEN APPLE</div></div><div class="topnote">好きでいることが<br>私の生きる理由 ♡</div></div></header>
<main id="app"></main>
<button class="fab" onclick="quickAdd()">＋</button>
<nav><div class="navin" id="nav"></div></nav>
</div>
<script>
const KEY="mga-personal-v1";
const seed={schedules:[
{id:1,date:"2026-09-20",title:"TV出演",cat:"TV",note:"出演予定をチェック"},
{id:2,date:"2026-09-25",title:"グッズ発売",cat:"GOODS",note:"欲しいものを確認"},
{id:3,date:"2026-10-01",title:"チケット応募締切",cat:"TICKET",note:"応募忘れ注意"}],
goods:[{id:1,name:"ツアーTシャツ",price:4500,status:"欲しい"},{id:2,name:"タオル",price:2500,status:"購入済"},{id:3,name:"キーホルダー",price:1200,status:"購入済"}],
money:[{id:1,date:"2026-09-01",cat:"グッズ",amount:4500,note:"Tシャツ"}],
lives:[{id:1,date:"2026-08-10",name:"参戦ライブ",venue:"東京",attended:true,setlist:["ダーリン","ライラック"],report:"最高だった！"}],
songs:["ダーリン","ライラック","クスシキ","ケセラセラ","青と夏","Soranji","点描の唄","僕のこと","インフェルノ","StaRt","ロマンチシズム","Magic","ニュー・マイ・ノーマル","ダンスホール"],
profile:{favorite:"ダーリン",firstLive:"—"}};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
let page="home";
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function yen(n){return "¥"+Number(n||0).toLocaleString("ja-JP")}
function icon(p){return ({home:"🍏",schedule:"📅",goods:"🛍️",money:"💰",music:"🎧",live:"🎤"})[p]}
function renderNav(){document.getElementById("nav").innerHTML=["home","schedule","goods","money","music","live"].map(p=>`<button class="${page==p?"active":""}" onclick="go('${p}')"><span class="ni">${icon(p)}</span>${({home:"ホーム",schedule:"予定",goods:"グッズ",money:"お金",music:"音楽",live:"ライブ"})[p]}</button>`).join("")}
function go(p){page=p;renderNav();render()}
function render(){renderNav();let a=document.getElementById("app"); if(page=="home")a.innerHTML=home();if(page=="schedule")a.innerHTML=schedule();if(page=="goods")a.innerHTML=goods();if(page=="money")a.innerHTML=money();if(page=="music")a.innerHTML=music();if(page=="live")a.innerHTML=live()}
function home(){
let total=db.money.reduce((s,x)=>s+Number(x.amount),0),heard=[...new Set(db.lives.flatMap(x=>x.setlist||[]))].length;
let today=new Date().toISOString().slice(0,10),next=[...db.schedules].sort((a,b)=>a.date.localeCompare(b.date)).find(x=>x.date>=today);
let days=next?Math.max(0,Math.ceil((new Date(next.date+'T00:00:00')-new Date(today+'T00:00:00'))/86400000)):0;
let recent=[...new Set(db.lives.flatMap(x=>x.setlist||[]))].slice(-2).reverse();
if(recent.length===0) recent=[db.profile.favorite||'ダーリン','クスシキ'];
return `<section class="hero2"><div class="heroInner"><div class="heroVisual"><div class="heroTitle">Mrs.<br>GREEN APPLE<br>♡</div></div><div class="heroInfo"><div class="eyebrow">NEXT EVENT</div><div class="nextDate">${next?next.date.replaceAll('-','.'):'予定を追加'}</div><div class="nextTitle">${next?next.title:'あなたの予定'}</div><div class="days">あと <strong>${days}</strong> <span>日</span></div></div><div class="heroArrow">›</div></div></section>
<div class="grid"><div class="stat"><div class="statIcon">🎫</div><b>${db.lives.filter(x=>x.attended).length}</b><span>参戦ライブ</span><small>公演</small></div><div class="stat"><div class="statIcon">♪</div><b>${heard}</b><span>ライブで聴いた曲</span><small>曲</small></div><div class="stat"><div class="statIcon">¥</div><b>${yen(total)}</b><span>推し活総額</span></div><div class="stat"><div class="statIcon">🛍️</div><b>${db.goods.filter(x=>x.status=='購入済').length}</b><span>持ってるグッズ</span><small>個</small></div></div>
<div class="section"><div class="today"><div class="todayTitle">♪ Today's Mrs. GREEN APPLE</div><div class="todayGrid">${recent.map((s,i)=>`<div class="songCard"><div class="songLabel">${i===0?'最近よく聴いてる':'今いちばん好き'}</div><div class="songName">${s}</div><div class="songArtist">Mrs. GREEN APPLE</div><div class="playdot">▶</div></div>`).join('')}</div></div></div>
<div class="section"><div class="sectionHead"><h2>🌱 すぐ開く</h2><span class="scribble">Quick Access ♡</span></div><div class="quick">${['schedule','goods','money','music','live'].map(p=>`<div class="quickCard" onclick="go('${p}')"><div class="quickIcon">${icon(p)}</div><b>${({schedule:'予定',goods:'グッズ',money:'お金',music:'音楽',live:'ライブ'})[p]}</b><span>${p==='music'||p==='live'?'タップして見る':'タップして管理'}</span></div>`).join('')}</div></div>
<div class="section"><div class="sectionHead"><h2>🍏 MY DATA</h2><span class="scribble">My data</span></div><div class="mydata"><div class="dataRow"><div class="dataIcon">♡</div><div class="grow"><b>好きな曲</b><div class="muted">${db.profile.favorite||'未登録'}${recent[1]?` / ${recent[1]}`:''}</div></div><span class="chev">›</span></div><div class="dataRow"><div class="dataIcon">🎫</div><div class="grow"><b>初参戦</b><div class="muted">${db.profile.firstLive||'未登録'}</div></div><span class="chev">›</span></div><div class="dataRow"><div class="dataIcon">☆</div><div class="grow"><b>推し活スタート</b><div class="muted">自分だけのミセス記録を残そう</div></div><span class="chev">›</span></div></div></div>
<div class="section"><div class="card" style="width:100%;min-width:0;background:linear-gradient(135deg,#e9f6ef,#fff)" onclick="alert('次の段階で、あなたの登録データをもとに相談できるAIを追加できます。')">🤖 <b>ミセスAIに相談する</b><span class="muted">「次の応募期限いつ？」「参戦ライブまとめて！」など</span></div></div>`}

function schedule(){return `<div class="section"><h2>📅 予定</h2><form onsubmit="addSchedule(event)"><label>予定名</label><input id="st" required placeholder="例：テレビ出演"><label>日付</label><input id="sd" type="date" required><label>種類</label><select id="sc"><option>TV</option><option>EVENT</option><option>TICKET</option><option>GOODS</option><option>OTHER</option></select><label>メモ</label><input id="sn" placeholder="応募期限など"><button class="primary" style="margin-top:12px">予定を追加</button></form><div class="list">${[...db.schedules].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><div>📌</div><div class="grow"><b>${x.title}</b><div class="muted">${x.date} · ${x.note||""}</div></div><span class="pill">${x.cat}</span></div>`).join("")||'<div class="empty">予定はまだありません</div>'}</div></div>`}
function goods(){return `<div class="section"><h2>🛍️ グッズ</h2><form onsubmit="addGoods(event)"><label>グッズ名</label><input id="gn" required placeholder="例：ライブTシャツ"><label>価格</label><input id="gp" type="number" required><label>状態</label><select id="gs"><option>欲しい</option><option>購入済</option></select><button class="primary" style="margin-top:12px">追加</button></form><div class="list">${db.goods.map(x=>`<div class="item"><div class="icon">🛍️</div><div class="grow"><b>${x.name}</b><div class="muted">${yen(x.price)}</div></div><span class="pill">${x.status}</span></div>`).join("")||'<div class="empty">グッズを登録しよう</div>'}</div></div>`}
function money(){let total=db.money.reduce((s,x)=>s+Number(x.amount),0),cats={};db.money.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+Number(x.amount));return `<div class="section"><h2>💰 推し活のお金</h2><div class="hero"><div class="small">TOTAL</div><div class="money">${yen(total)}</div><p>グッズ・チケット・遠征費などをまとめて記録</p></div><form onsubmit="addMoney(event)"><label>金額</label><input id="ma" type="number" required><label>日付</label><input id="md" type="date" required><label>カテゴリ</label><select id="mc"><option>グッズ</option><option>チケット</option><option>交通</option><option>ホテル</option><option>CD/DVD</option><option>サブスク</option><option>その他</option></select><label>メモ</label><input id="mn"><button class="primary" style="margin-top:12px">支出を追加</button></form><div class="list">${Object.entries(cats).map(([k,v])=>`<div class="item"><div>${({グッズ:"🛍️",チケット:"🎫",交通:"🚃",ホテル:"🏨","CD/DVD":"💿",サブスク:"📱",その他:"📝"})[k]}</div><div class="grow"><b>${k}</b></div><b>${yen(v)}</b></div>`).join("")}</div></div>`}
function music(){let heard=[...new Set(db.lives.flatMap(x=>x.setlist||[]))];return `<div class="section"><h2>🎧 音楽</h2><div class="grid"><div class="stat"><b>—</b><span>再生回数</span></div><div class="stat"><b>—</b><span>総再生時間</span></div></div><div class="card" style="margin-top:10px;width:100%;min-width:0"><b>Apple Music連携</b><p class="muted">ここは次の段階で連携方式を追加。まずは「ライブで聴いた曲」を自動集計します。</p></div><div class="section"><h2>ライブで聴いた曲 · ${heard.length}曲</h2><div class="list">${db.songs.map(s=>`<div class="item"><div>${heard.includes(s)?"✓":"○"}</div><div class="grow">${s}</div><span class="${heard.includes(s)?"check":"muted"}">${heard.includes(s)?"聴いた":"未体験"}</span></div>`).join("")}</div></div>`}
function live(){return `<div class="section"><h2>🎤 ライブ記録</h2><form onsubmit="addLive(event)"><label>ライブ名</label><input id="ln" required placeholder="例：○○ TOUR"><label>日付</label><input id="ld" type="date" required><label>会場</label><input id="lv"><label>セットリスト（1曲1行）</label><textarea id="ls" placeholder="ダーリン&#10;ライラック"></textarea><label>ライブレポ</label><textarea id="lr" placeholder="思い出を残そう"></textarea><button class="primary" style="margin-top:12px">ライブを保存</button></form><div class="list">${db.lives.map(x=>`<div class="item"><div class="icon">🎤</div><div class="grow"><b>${x.name}</b><div class="muted">${x.date} · ${x.venue||""}</div>${x.report?`<div class="muted" style="margin-top:5px">「${x.report}」</div>`:""}</div><span class="pill">${(x.setlist||[]).length}曲</span></div>`).join("")}</div></div>`}
function addSchedule(e){e.preventDefault();db.schedules.push({id:Date.now(),date:sd.value,title:st.value,cat:sc.value,note:sn.value});save();render()}
function addGoods(e){e.preventDefault();db.goods.push({id:Date.now(),name:gn.value,price:+gp.value,status:gs.value});save();render()}
function addMoney(e){e.preventDefault();db.money.push({id:Date.now(),date:md.value,cat:mc.value,amount:+ma.value,note:mn.value});save();render()}
function addLive(e){e.preventDefault();db.lives.push({id:Date.now(),date:ld.value,name:ln.value,venue:lv.value,attended:true,setlist:ls.value.split("\\n").map(x=>x.trim()).filter(Boolean),report:lr.value});save();render()}
function quickAdd(){let p=prompt("何を追加する？\\n1 予定\\n2 グッズ\\n3 支出\\n4 ライブ");if(p=="1")go("schedule");else if(p=="2")go("goods");else if(p=="3")go("money");else if(p=="4")go("live")}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
</script>
</body>
</html>
